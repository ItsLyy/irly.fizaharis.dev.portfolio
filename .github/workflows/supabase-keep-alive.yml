name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every Sunday and Wednesday (Every 3-4 days)
    - cron: "0 0 * * 0,3"
  workflow_dispatch: # Allows you to trigger it manually anytime

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Activity Query to Database Table
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
